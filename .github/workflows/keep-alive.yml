name: keep-alive

# Prevents the free-tier Supabase project (and the Railway backend) from
# auto-pausing after inactivity. The API's /ready probe runs a real `SELECT 1`
# against the database, so hitting it once a day counts as activity and keeps
# the project awake.
#
# Notes:
# - GitHub runs scheduled workflows ONLY from the repository's default branch,
#   so this must live on `main` to fire on schedule.
# - GitHub also disables scheduled workflows after ~60 days with no repository
#   activity. If this repo goes fully dormant that long, either push a commit or
#   add an external monitor (e.g. cron-job.org / UptimeRobot) hitting the same
#   /ready URL as a backup.
# - This PREVENTS pausing; it cannot un-pause an already-paused project (do that
#   once from the Supabase dashboard, then this keeps it up).

on:
  schedule:
    - cron: "23 7 * * *"   # daily at 07:23 UTC
  workflow_dispatch: {}     # allow manual "Run workflow" from the Actions tab

# Override the default by setting a repo variable KEEPALIVE_URL (Settings →
# Secrets and variables → Actions → Variables). Falls back to the known backend.
env:
  KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the readiness endpoint
        run: |
          URL="${KEEPALIVE_URL:-https://prism-production-1902.up.railway.app/ready}"
          echo "GET $URL"
          STATUS=$(curl -sS --max-time 30 --retry 5 --retry-delay 15 --retry-all-errors \
            -o response.txt -w "%{http_code}" "$URL" || echo "000")
          echo "HTTP $STATUS"
          cat response.txt || true
          test "$STATUS" = "200"
