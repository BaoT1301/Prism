name: keep-db-alive

# Keeps the free-tier Supabase database from auto-pausing by running a trivial
# query directly against it — independent of the Railway backend (so it works
# even while the backend is down or redeploying).
#
# Setup: add a repository secret named DATABASE_URL
#   (Settings -> Secrets and variables -> Actions -> New repository secret)
#   value = the Supabase Session Pooler connection string.
#
# Notes:
# - GitHub runs scheduled workflows ONLY from the default branch, so this must be
#   on `main` to fire on schedule (workflow_dispatch lets you run it by hand).
# - Prevents pausing; it cannot un-pause an already-paused project.

on:
  schedule:
    - cron: "41 7 * * *"   # daily at 07:41 UTC
  workflow_dispatch: {}

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Run SELECT 1 against Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set."
            exit 1
          fi
          command -v psql >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          echo "Pinging database with SELECT 1..."
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "select 1;"
          echo "Database is awake."
